# Private preview only. No new public listener, ingress rule or TLS change.
server {
    listen 127.0.0.1:4174;
    server_name localhost;
    root /opt/wiki-interest/current/site;
    index index.html;
    charset utf-8;
    server_tokens off;
    autoindex off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    location = /data/snapshot.json {
        alias /var/lib/wiki-interest/public/snapshot.json;
        expires -1;
    }
    location = /data/status.json {
        alias /var/lib/wiki-interest/public/status.json;
        expires -1;
    }
    location = /data/context.json {
        expires -1;
        try_files $uri =404;
    }
    location = /data/archive.json {
        alias /var/lib/wiki-interest/public/archive.json;
        expires -1;
    }
    location = /data/descriptions.json {
        alias /var/lib/wiki-interest/public/descriptions.json;
        expires -1;
    }
    # Only validated projections, never an alias to private history or revisions.
    location ~ "^/data/archive/(?<archive_date>[0-9]{4}-[0-9]{2}-[0-9]{2})\.json$" {
        alias /var/lib/wiki-interest/public/archive/$archive_date.json;
        expires -1;
    }
    # Only explicit data products are routable; caches and source remain private.
    location /data/ { return 404; }
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }
    location = / { expires -1; }
    location = /index.html { expires -1; }
    location / { return 404; }
}
